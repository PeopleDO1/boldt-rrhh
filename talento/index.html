<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#f5f6fa}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1a1a1a;min-height:100vh;display:flex;flex-direction:column;align-items:center}
#app{width:100%;display:flex;flex-direction:column;align-items:center}

:root{
  --violet:#6B21A8;
  --violet-soft:#F4EAFB;
  --gray:#6b7280;
  --border:#e5e7eb;
  --bg:#f5f6fa;
  --pendiente:#B45309; --pendiente-bg:#FEF3C7;
  --curso:#1D4ED8; --curso-bg:#DBEAFE;
  --cerrado:#15803D; --cerrado-bg:#DCFCE7;
  --info:#4B5563; --info-bg:#F3F4F6;
  --idea:#7C3AED; --idea-bg:#EDE9FE;
}

.hero-band{width:100%;background:linear-gradient(135deg,#4B3FD6,#5A46E0);color:#fff}
.hero-inner{max-width:1440px;margin:0 auto;padding:22px 3rem 30px}

.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:34px}
.hero-eyebrow{font-size:11.5px;letter-spacing:1px;font-weight:600;color:rgba(255,255,255,.75);text-transform:uppercase}
.hero-top-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.hero-date{font-size:12px;color:rgba(255,255,255,.75)}
.hero-nav{display:flex;gap:8px}
.hero-nav a{font-size:12px;padding:5px 12px;border-radius:20px;text-decoration:none;color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.3);transition:.15s}
.hero-nav a.active{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.5);color:#fff;font-weight:600}
.hero-nav a:hover:not(.active){border-color:rgba(255,255,255,.6);color:#fff}

.hero-main{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px}
.hero-h1{font-family:Cambria,Georgia,serif;font-size:34px;line-height:1.15}
.hero-bold{font-weight:700;color:#fff}
.hero-dash{font-weight:400;color:rgba(255,255,255,.7)}
.hero-accent{font-style:italic;font-weight:400;color:#FDA24D}
.hero-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.hero-pill{font-size:12px;font-weight:600;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:5px 14px;border-radius:20px}
.hero-author{font-size:12.5px;color:rgba(255,255,255,.85)}

.wrap{width:100%;max-width:1440px;padding:2rem 3rem 4rem}

.notice{background:var(--violet-soft);border:1px solid #E4CFF3;color:#5b21a0;font-size:12.5px;border-radius:10px;padding:10px 14px;margin-bottom:1.75rem;line-height:1.5}

.resumen-header{margin-bottom:1.25rem}
.resumen-eyebrow{font-size:11.5px;letter-spacing:.8px;font-weight:700;color:var(--gray);text-transform:uppercase}
.resumen-text{font-size:14px;color:#374151;line-height:1.6;margin-top:8px;border-top:1px solid var(--border);padding-top:12px}

.progress-bar{height:10px;border-radius:6px;overflow:hidden;display:flex;background:#e5e7eb;margin-bottom:10px}
.progress-seg{height:100%}
.progress-legend{display:flex;gap:20px;flex-wrap:wrap;font-size:12.5px;color:#374151;margin-bottom:2rem}
.progress-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}

.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:2rem}
.stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column}
.stat .l{font-size:12px;color:var(--gray);order:1}
.stat .n{font-family:Cambria,Georgia,serif;font-size:32px;font-weight:400;order:2;margin:4px 0 2px}
.stat .sub{font-size:11.5px;color:var(--gray);order:3}
.stat.pend .n{color:var(--pendiente)}
.stat.curso .n{color:var(--curso)}
.stat.cerrado .n{color:var(--cerrado)}
.stat.proy .n{color:var(--violet)}
.stat.total .n{color:#1a1a1a}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.5rem}
.filters button{font-size:12.5px;padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:#fff;color:var(--gray);cursor:pointer;transition:.15s}
.filters button:hover{border-color:var(--violet);color:var(--violet)}
.filters button.active{background:var(--violet);border-color:var(--violet);color:#fff}

.sections-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}

.section{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;cursor:pointer}
.section-head-left{display:flex;align-items:center;gap:10px}
.section-title{font-size:15px;font-weight:700}
.section-count{font-size:11.5px;color:var(--gray);font-weight:400}
.chevron{font-size:11px;color:var(--gray);transition:transform .2s}
.section.open .chevron{transform:rotate(180deg)}

.section-body{max-height:0;overflow:hidden;transition:max-height .25s ease}
.section.open .section-body{max-height:1600px}
.item{padding:12px 20px;border-top:1px solid var(--border)}
.item:hover{background:#fafafa}
.item.hidden{display:none}

.item-top{display:flex;align-items:baseline;gap:8px}
.badge{flex:0 0 auto;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:6px;text-align:center;white-space:nowrap}
.badge.tarea{background:var(--violet-soft);color:var(--violet)}
.badge.proyecto{background:var(--violet);color:#fff}
.item-title{flex:1;font-size:13.5px;font-weight:600;line-height:1.4}
.estado{flex:0 0 auto;font-size:10px;font-weight:600;padding:3px 8px;border-radius:6px;text-align:center;white-space:nowrap}

.item-bottom{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:5px;padding-left:2px}
.item-note{font-size:12px;color:var(--gray);line-height:1.4}
.item-meta{font-size:11.5px;color:var(--gray);white-space:nowrap;text-align:right}
.item-meta .resp{font-weight:600;color:#374151}

.empty{padding:24px 20px;text-align:center;color:var(--gray);font-size:13px}

.iniciativas-header{margin:2.5rem 0 1rem}

<script>
const DATA = JSON.parse(document.getElementById('DATA').textContent);

function estadoClass(e){ return e.replace(' ', '.'); }

function computeAgendaTablero(){
  const hoy = new Date();
  const limite = new Date(2026, 11, 15, 23,59,59); // 15 de diciembre 2026
  const msPorSemana = 7*24*60*60*1000;
  const semanasRestantes = Math.max(0, Math.ceil((limite - hoy)/msPorSemana));
  let total = 0, transcurridas = 0;
  DATA.agenda.forEach(m=>{
    m.items.forEach(it=>{
      total++;
      const fin = new Date(m.anio, m.mesNum-1, it.fin, 23,59,59);
      if(fin < hoy) transcurridas++;
    });
  });
  const pendientes = total - transcurridas;
  const pctAvance = total>0 ? Math.round(transcurridas/total*100) : 0;
  const porSemana = semanasRestantes>0 ? Math.round((pendientes/semanasRestantes)*10)/10 : pendientes;
  return {total,transcurridas,pendientes,semanasRestantes,pctAvance,porSemana};
}

const ACCION_PALETTE = [
  {bg:'#DBEAFE',text:'#1D4ED8'},
  {bg:'#CCFBF1',text:'#0F766E'},
  {bg:'#FCE7F3',text:'#BE185D'},
  {bg:'#FEF9C3',text:'#854D0E'},
  {bg:'#DCFCE7',text:'#15803D'},
  {bg:'#E0E7FF',text:'#4338CA'},
  {bg:'#CFFAFE',text:'#0E7490'},
  {bg:'#FFE4E6',text:'#BE123C'},
  {bg:'#ECFCCB',text:'#4D7C0F'},
  {bg:'#F3E8FF',text:'#7E22CE'}
];
function getAccionColor(titulo){
  let hash = 0;
  for(let i=0;i<titulo.length;i++){ hash = (hash*31 + titulo.charCodeAt(i)) % 100000; }
  return ACCION_PALETTE[hash % ACCION_PALETTE.length];
}

function buildMonthWeeks(year, monthNum){
  const monthIndex = monthNum - 1;
  const daysInMonth = new Date(year, monthIndex+1, 0).getDate();
  let startWeekday = new Date(year, monthIndex, 1).getDay(); // 0=Dom..6=Sab
  startWeekday = (startWeekday+6)%7; // 0=Lun..6=Dom
  const cells = [];
  for(let i=0;i<startWeekday;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);
  while(cells.length%7!==0) cells.push(null);
  const weeks=[];
  for(let i=0;i<cells.length;i+=7) weeks.push(cells.slice(i,i+7));
  return weeks;
}

function estadoColorCal(estado){
  if(estado==='Confirmado') return {bg:'var(--cerrado-bg)',color:'var(--cerrado)'};
  return {bg:'var(--pendiente-bg)',color:'var(--pendiente)'};
}

function computeStats(secciones){
  let pend=0, curso=0, cerrado=0, proy=0;
  secciones.forEach(s=>s.items.forEach(i=>{
    if(i.estado==='Pendiente') pend++;
    if(i.estado==='En curso') curso++;
    if(i.estado==='Cerrado') cerrado++;
    if(i.tipo==='Proyecto') proy++;
  }));
  const total = pend+curso+cerrado;
  const pct = n => total>0 ? Math.round(n/total*100) : 0;
  return {pend,curso,cerrado,proy,total,pctPend:pct(pend),pctCurso:pct(curso),pctCerrado:pct(cerrado)};
}

function computeBusquedasStats(){
  const bq = DATA.busquedas || [];
  const total = bq.length;
  const totalVacantes = bq.reduce((acc,b)=> acc + (b.vacantes||1), 0);
  const cerradas = bq.filter(b=>b.estado==='Cerrada').length;
  const tasa = total>0 ? Math.round(cerradas/total*100) : 0;
  const porResp = {};
  bq.forEach(b=>{ porResp[b.responsable] = (porResp[b.responsable]||0)+1; });
  const porMotivo = {};
  bq.forEach(b=>{ porMotivo[b.motivo] = (porMotivo[b.motivo]||0)+1; });
  const hoy = new Date();
  const dias = (a,b) => Math.round((b-a)/(1000*60*60*24));
  const conProyeccion = bq.filter(b=>b.fechaApertura && b.fechaIngresoEstimada);
  let ttfAvg = null;
  if(conProyeccion.length>0){
    const totalDias = conProyeccion.reduce((acc,b)=> acc + dias(new Date(b.fechaApertura), new Date(b.fechaIngresoEstimada)), 0);
    ttfAvg = Math.round(totalDias/conProyeccion.length);
  }
  const bqConAntiguedad = bq.map(b=>({
    ...b,
    antiguedad: b.fechaApertura ? dias(new Date(b.fechaApertura), hoy) : null
  }));
  return {bq:bqConAntiguedad,total,totalVacantes,cerradas,tasa,porResp,porMotivo,ttfAvg};
}

let activeFilter = 'todas';
let selectedDay = {};
let openSections = {};

function isOpenFor(id, defaultVal){
  if(openSections[id]===undefined) openSections[id] = defaultVal;
  return openSections[id];
}

function selectDay(idx, day){
  selectedDay[idx] = (selectedDay[idx] === day) ? null : day;
  render();
}

function matchesFilter(item){
  if(activeFilter==='todas') return true;
  if(activeFilter==='tareas') return item.tipo==='Tarea';
  if(activeFilter==='proyectos') return item.tipo==='Proyecto';
  if(activeFilter==='pendiente') return item.estado==='Pendiente';
  if(activeFilter==='curso') return item.estado==='En curso';
  if(activeFilter==='cerrado') return item.estado==='Cerrado';
  return true;
}

function setFilter(f){ activeFilter = f; render(); }
function toggleSection(id){
  openSections[id] = !isOpenFor(id, false);
  render();
}

    const selIsWeekend = selDayCol===5 || selDayCol===6;
    const selItems = selDay ? m.items.filter(it=> selDay>=it.inicio && selDay<=it.fin && (!selIsWeekend || it.finde===true)) : [];
    const agendaOpen = isOpenFor(mid, false);
    html += `
    <div class="section expand-full ${agendaOpen?'open':''}" id="sec-${mid}">
      <div class="section-head iniciativa-head" onclick="toggleSection('${mid}')">
        <div class="section-head-left">
          <span class="section-title">${m.mes}</span>
          <span class="section-count">${m.items.length} acción${m.items.length===1?'':'es'}</span>
        </div>
        <span class="chevron">▾</span>
      </div>
      <div class="section-body">
        <div class="cal-wrap">
        <div class="cal-grid">
          ${dow.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
          ${weeks.map(week=>week.map((day,col)=>{
            if(day===null) return '<div class="cal-cell empty"></div>';
            const isWeekend = col===5 || col===6;
            const feriado = (m.feriados||[]).find(f=>f.dia===day);
            const dayItems = m.items.filter(it=> day>=it.inicio && day<=it.fin && (!isWeekend || it.finde===true));
            const clickable = dayItems.length>0 || !!feriado;
            const isSel = selDay===day;
            const cls = ['cal-cell', clickable?'cal-cell-clickable':'', isSel?'cal-cell-active':'', isWeekend?'cal-weekend':'', feriado?(feriado.tipo==='oficial'?'cal-feriado':'cal-feriado-obs'):''].filter(Boolean).join(' ');
            return `<div class="${cls}" ${clickable?`onclick="selectDay(${idx},${day})"`:''}>
              <div class="cal-daynum">${day}</div>
              ${feriado ? `<div class="cal-tag cal-tag-feriado">${feriado.nombre}</div>` : ''}
              ${dayItems.slice(0,2).map(it=>{const c=getAccionColor(it.titulo); return `<div class="cal-tag" style="background:${c.bg};color:${c.text}">${it.titulo}</div>`;}).join('')}
              ${dayItems.length>2 ? `<div class="cal-more">+${dayItems.length-2} más</div>` : ''}
            </div>`;
          }).join('')).join('')}
        </div>
        </div>
        <div class="cal-legend">
          <span><i style="background:repeating-linear-gradient(45deg,#f3f4f6,#f3f4f6 3px,#fff 3px,#fff 6px)"></i>Fin de semana</span>
          <span><i style="background:#FEE2E2;border-color:#FCA5A5"></i>Feriado oficial</span>
          <span><i style="background:#FFEDD5;border-color:#FDBA74"></i>Día no oficial (observado)</span>
        </div>
        ${selDay ? `
        <div class="cal-detail">
          <div class="cal-detail-head">
            <span class="cal-detail-date">${selDay} de ${m.mes}</span>
            <span class="cal-detail-close" onclick="selectDay(${idx},${selDay})">✕</span>
          </div>
          <ul class="cal-detail-list">
            ${(m.feriados||[]).filter(f=>f.dia===selDay).map(f=>`<li><strong>Feriado${f.tipo==='observado'?' (no oficial)':''}:</strong> ${f.nombre}</li>`).join('')}
            ${selItems.map(it=>`<li>${it.titulo}</li>`).join('')}
          </ul>
        </div>` : ''}
        ${m.items.length===0 ? '<div class="empty">Pendiente de cargar.</div>' : ''}
      </div>
    </div>`;
  });
  html += '</div>';

  html += `
    <div class="iniciativas-header">
      <h2 class="iniciativas-title">Calendario / Fechas Importantes</h2>
      <div class="iniciativas-sub">Vacaciones del equipo y fechas clave a tener en cuenta.</div>
    </div>
    <div class="section open">
      <div class="section-body" style="max-height:1600px">
        ${DATA.calendario.map(c=>{
          const col = estadoColorCal(c.estado);
          return `
          <div class="item item-only-estado">
            <div class="item-top">
              <span class="item-title">${c.titulo}</span>
              <span class="estado" style="background:${col.bg};color:${col.color}">${c.estado}</span>
            </div>
            ${c.nota ? `<div class="item-bottom"><div class="item-note">${c.nota}</div></div>` : ''}
          </div>`;
        }).join('')}
      </div>
    </div>

    <footer>PeopleDO HR Consulting · Grupo Boldt · Dashboard de Talento y Cultura</footer>
  </div>`;

  app.innerHTML = html;
}

render();
</script>
</body>
</html>
